name: Auto Deploy from Gist

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          token: ${{ secrets.PAT_TOKEN }}

      - name: Apply Gist update
        run: |
          GIST_URL="https://gist.githubusercontent.com/mansoorali0-ux/1ab82824f4da39e42349663f55232101/raw/update.json"
          curl -sf "$GIST_URL" -o /tmp/update.json || exit 0
          GIST_VER=$(python3 -c "import json; print(json.load(open('/tmp/update.json')).get('version','none'))")
          CURRENT=$(cat .deployed-version 2>/dev/null || echo "none")
          echo "Gist: $GIST_VER | Current: $CURRENT"
          if [ "$GIST_VER" = "$CURRENT" ]; then echo "Up to date"; exit 0; fi
          python3 -c "
import json, os
data = json.load(open('/tmp/update.json'))
for path, content in data.get('files', {}).items():
    d = os.path.dirname(path)
    if d: os.makedirs(d, exist_ok=True)
    open(path, 'w').write(content)
    print('Updated:', path)
open('.deployed-version','w').write(data.get('version','0'))
print('Done:', data.get('version'))
"

      - name: Commit and push
        run: |
          git config user.email "pitchside-bot@deploy.app"
          git config user.name "PitchSide Bot"
          git add -A
          git diff --staged --quiet && echo "Nothing to commit" && exit 0
          VER=$(cat .deployed-version 2>/dev/null || echo "unknown")
          git commit -m "Auto-deploy v$VER"
          git push
